services:
  - type: web
    name: koech-labs-landing
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    # This is a static site, so we don't need a startCommand
    rootDir: .
    envVars:
      - key: NODE_VERSION
        value: 16
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache 